<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a saved theme before first paint so the page never flashes the other one.
      try {
        const t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <meta
      name="description"
      content="Grace Muthoni Kamau — Service Design, User Design, Product Design and UX Research. Three Safaricom case studies, each built around a real decision."
    />
    <title>
      Service Design, User Design, Product Design and UX Research — Grace Muthoni Kamau
    </title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

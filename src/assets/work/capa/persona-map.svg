<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="533" viewBox="0 0 1200 533" role="img"><title>Role based persona map</title><rect x="0" y="0" width="1200" height="533" rx="0" fill="#F8F7F1"/><text x="48" y="69" font-family="DejaVu Sans, Arial, sans-serif" font-size="41" font-weight="700" fill="#202820">Who needed what from the tool?</text><text x="50" y="113" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#546050">Role map reconstructed from my persona mapping and the documented workflow.</text><rect x="47" y="149" width="1106" height="60" rx="7" fill="#E5EDD9"/><text x="68" y="187" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#202820">Frontline staff</text><text x="390" y="187" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#202820">Record the customer’s issue once and give it enough context for review.</text><rect x="47" y="221" width="1106" height="60" rx="7" fill="#FFFFFF"/><text x="68" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#202820">Quality team</text><text x="390" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#202820">Decide who should investigate and check the quality of the analysis.</text><rect x="47" y="293" width="1106" height="60" rx="7" fill="#E5EDD9"/><text x="68" y="331" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#202820">Resolution owner</text><text x="390" y="331" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#202820">Identify the cause, correct the immediate issue and propose prevention.</text><rect x="47" y="365" width="1106" height="60" rx="7" fill="#FFFFFF"/><text x="68" y="403" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#202820">Approving lead</text><text x="390" y="403" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#202820">Review the evidence and decide whether the case can progress.</text><rect x="47" y="437" width="1106" height="60" rx="7" fill="#E5EDD9"/><text x="68" y="475" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#202820">Preventive action owner</text><text x="390" y="475" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#202820">Know what was agreed, when it is due and what remains open.</text></svg>
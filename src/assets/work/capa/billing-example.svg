<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img"><title>One account billed for two products</title><rect x="0" y="0" width="1200" height="450" rx="0" fill="#F8F7F1"/><rect x="43" y="42" width="494" height="326" rx="20" fill="#FFFFFF"/><text x="75" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#546050">BILLING DISCREPANCY</text><text x="74" y="171" font-family="DejaVu Sans, Arial, sans-serif" font-size="45" font-weight="700" fill="#202820">One account</text><text x="76" y="228" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#202820">Previous product     Billed</text><text x="76" y="277" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#202820">Replacement            Billed</text><rect x="76" y="247" width="415" height="2" rx="0" fill="#CAD0C2"/><rect x="557" y="42" width="600" height="326" rx="20" fill="#202820"/><text x="590" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#C4ECA1">CAPA REVIEW</text><text x="590" y="166" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">What caused the overlap?</text><text x="590" y="222" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#FFFFFF">Correct the customer’s bill.</text><text x="590" y="263" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#FFFFFF">Review the cause before approval.</text><text x="590" y="304" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#FFFFFF">Assign the work to prevent a repeat.</text><text x="50" y="416" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#546050">Illustration based on a documented billing issue. No customer data is shown.</text></svg>
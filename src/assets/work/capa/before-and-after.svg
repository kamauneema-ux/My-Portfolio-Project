<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="552" viewBox="0 0 1200 552" role="img"><title>Before and after the CAPA internal tool</title><rect x="0" y="0" width="1200" height="552" rx="0" fill="#F8F7F1"/><text x="46" y="66" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="700" fill="#202820">From email approvals to a shared case</text><rect x="46" y="105" width="545" height="365" rx="18" fill="#FFFFFF"/><text x="72" y="159" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#202820">Before</text><text x="72" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#546050">01</text><text x="116" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#202820">Complaint raised by email or phone</text><text x="72" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#546050">02</text><text x="116" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#202820">Credit team investigates the bill</text><text x="72" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#546050">03</text><text x="116" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#202820">Approvals gathered by email</text><text x="72" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#546050">04</text><text x="116" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#202820">Teams chase outstanding actions</text><rect x="610" y="105" width="545" height="365" rx="18" fill="#202820"/><text x="636" y="159" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Journey I designed</text><text x="636" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#C4ECA1">01</text><text x="680" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">Staff log the issue in CAPA</text><text x="636" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#C4ECA1">02</text><text x="680" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">Quality team routes it to an owner</text><text x="636" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#C4ECA1">03</text><text x="680" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">Resolution team documents cause and actions</text><text x="636" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#C4ECA1">04</text><text x="680" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">CAPA approval precedes credit note issuance</text><text x="636" y="406" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#C4ECA1">05</text><text x="680" y="406" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">Preventive action stays with a named owner</text><text x="48" y="516" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#546050">The CAPA approval and the financial posting of a credit note are separate steps.</text></svg>